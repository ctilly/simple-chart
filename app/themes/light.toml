name = "Light"
dark = false

[colors]
# Core surfaces and text
background = "#ffffff"
foreground = "#333333"
surface = "#f7f7f7"
raised = "#eeeeee"
panel = "#eef2f4"
border = "#9d978d"
control_border = "#cccccc"
panel_border = "#c8d0d4"
input_border = "#c6c6c6"
text_secondary = "#555555"
text_strong = "#222222"
text_disabled = "#aaaaaa"
# Status and emphasis
primary = "#0b5cad"
accent = "#e7f1fb"
success = "#198754"
warning = "#d39e00"
error = "#c43d3d"
error_background = "#fbeaea"
error_strong = "#a12e2e"
pending = "#8a8e96"
info_strong = "#33414d"
revision_highlight = "#fff3cd"
corroboration_highlight = "#d9ead3"
swatch_border = "#666666"
# Chart (grid keeps the axis foreground's RGB; only its alpha is used)
grid = "#3333330f"
crosshair = "#00000077"
last_price = "#0000ff"
candle_up = "#00c853"
candle_down = "#ff3d3d"
volume_up = "#00c85366"
volume_down = "#ff3d3d66"
# Symbol bar
tf_active = "#00d4d4"
tf_active_border = "#00b8b8"
# Watchlist
percent_up = "#1f8f45"
percent_down = "#c7392f"
percent_flat = "#666666"
percent_unknown = "#888888"
list_background = "#fafafa"
list_hover = "#f0f0f0"
selection = "#d0eeff"
watchlist_header_background = "#e0e0e0"
watchlist_header_foreground = "#444444"
watchlist_rule = "#c8c8c8"
watchlist_button_background = "#f5f5f5"
watchlist_button_hover = "#e8e8e8"
# Floating palettes (Tools, Add Symbol) and the legend strip
popup_border = "#b8bcc5"
popup_title_background = "#dddddd"
popup_title_border = "#c4c4c4"
popup_close_hover = "#d0d0d0"
tool_checked_background = "#d6e4ff"
tool_checked_border = "#4f7cff"
add_button = "#2d6cf6"
add_button_hover = "#4a82ff"
# Window chrome (title bar)
chrome_background = "#dedede"
chrome_foreground = "#202020"
chrome_hover = "#c6c6c6"
chrome_pressed = "#b5b5b5"
chrome_focus = "#6f6f6f"
chrome_icon = "#303030"
# Header band (dark in every theme)
header_background = "#2f3437"
header_border = "#1f2427"
header_symbol = "#ffffff"
header_name = "#c2ccd3"
header_label = "#aab5bd"
header_value = "#d7dde1"
