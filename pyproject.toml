[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplechart"
version = "0.1.0"
description = "A desktop stock charting application for swing traders"
requires-python = ">=3.13"

dependencies = [
    "PyQt6>=6.6",
    "finplot>=1.9.7,<1.10",  # pyqtgraph-based finance charting; pulls in pandas. Capped: viewport.py monkeypatches finplot/pyqtgraph private internals, so a minor bump needs a tested upgrade.
    "yfinance>=0.2",     # dev/test data provider; replace with Alpaca in production
    "numpy>=1.26",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "mypy>=1.8",         # type checking + mypyc compilation
    "pytest>=8.0",
    "pytest-qt>=4.4",    # Qt widget testing helpers
    "ruff>=0.8",         # fast linting
    "vulture>=2.13",     # dead-code audit tool; review findings manually
    "setuptools>=68",    # required by scripts/build_compiled.py
]

[project.scripts]
simplechart = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "chart*", "data*", "indicators*", "simplechart*", "tools*"]

# ------------------------------------------------------------------
# mypyc compilation targets
# ------------------------------------------------------------------
# Modules listed here are compiled to native C extensions by
# scripts/build_compiled.py. Add a module path here, then run the
# build script — no other changes needed.
#
# Rules for a module to be compilable:
#   - All parameters and return values must be explicitly typed
#   - No use of Any, Union in hot paths
#   - No I/O (no file access, no network, no print)
#   - No ABCMeta, no dynamic attribute setting
#
# Omit this section or leave targets empty to run interpreted (fine
# for development — the .py files are valid Python and run normally).

[tool.simplechart.compile]
targets = [
    "indicators.ema._kernel",
    "indicators.avwap._kernel",
    "indicators.rsi._kernel",
]

# ------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true   # finplot has no type stubs

# ------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------

[tool.ruff]
target-version = "py313"


# ------------------------------------------------------------------
# pyright / Pylance
# ------------------------------------------------------------------
# PyQt6's classes subclass the untyped `sip` layer, so under strict
# mode every Qt base resolves to Any and floods the editor with
# unknown-type warnings that aren't real bugs. Standard mode keeps
# meaningful checking on our own code without that noise.

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
# PyQt6's auto-generated stubs use placeholder parameter names (a0, a1, ev)
# in Qt event/override methods. Our overrides use readable names, which the
# rule flags as Liskov-incompatible — purely a stub-convention artifact, not
# a real bug. Off for the project; mypy provides override-compatibility checks
# where they're actually meaningful.
reportIncompatibleMethodOverride = false

# ------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
